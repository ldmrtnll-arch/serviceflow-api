[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "serviceflow-api"
version = "0.1.0"
description = "Ticket management and workflow API"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.4,<6",
  "dj-database-url>=2.3,<3",
  "Django>=5.1,<5.3",
  "django-filter>=24.3,<26",
  "djangorestframework>=3.15,<3.17",
  "djangorestframework-simplejwt>=5.4,<6",
  "drf-spectacular>=0.28,<0.29",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-django>=4.9,<5",
  "freezegun>=1.5,<2",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/admin.py", "*/management/*", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"
